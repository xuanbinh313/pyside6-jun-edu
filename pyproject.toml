[project]
name = "JunEdu"
version = "0.1.0"
requires-python = ">=3.8"
description = "Study Tool for Learning Languages"
authors = [
    { name = "BinhCoDev", email = "[EMAIL_ADDRESS]" }
]

[tool.pyside6-project]
# Cập nhật để PySide6 định vị được toàn bộ file code và file .ui mới
files = [
    "main.py",
    "src/**/*.py",
    "ui_gen/**/*.py",
    "ui/**/*.ui"
]

[tool.pyright]
# Cấu hình phạm vi quét dữ liệu
include = ["src", "ui_gen", "main.py"]
extraPaths = ["."]
pythonVersion = "3.9"

# 🔥 BẬT CHẾ ĐỘ ULTRA-STRICT NHƯNG BỎ QUA LỖI STUB QTAWESOME
typeCheckingMode = "strict"
reportMissingTypeStubs = "none" # <-- Giải quyết triệt để lỗi qtawesome gạch đỏ

reportUnknownVariableType = true
reportUnknownMemberType = true
reportUnknownParameterType = true
reportUnknownArgumentType = true
reportUnknownLambdaType = true
reportMissingTypeArgument = true
reportMissingParameterType = true
reportUntypedFunctionDecorator = true
reportUntypedBaseClass = true
reportUnusedImport = true
reportUnusedVariable = true

exclude = [
    ".venv", "venv", ".venv39", "venv39", ".venv313", "venv313",
    ".env", "__pycache__", "*.pyc", ".idea", ".vscode"
]

[tool.ruff]
src = ["src", "ui_gen"]
fix = true                  # <-- Luôn tự động sửa lỗi (bao gồm xóa import thừa) khi chạy lệnh `ruff check`

[tool.ruff.lint]
# 🔥 CHỈ ĐỊNH RUFF QUÉT LỖI IMPORT THỪA (F401) VÀ SẮP XẾP IMPORT (I)
select = [
    "F401", # Khử unused imports
    "I",    # Tự động sắp xếp import theo bảng chữ cái (isort)
]

[project.optional-dependencies]
dev = [
    "pyside6-tools>=6.0.0",
    "pyside6-essentials>=6.0.0",
    "qtkeychain>=20.1.0",
    "qtawesome>=1.2.0",
    "qasync>=0.25.0",
    "colorama>=0.4.6",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
    "Pillow>=11.3.0",
]